[package]
name = "keysmith-relay"
version = "0.1.0"
description = "Loopback relay that applies Keysmith input rewrite to Codex requests"
authors = ["Jia-Ethan"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.85.0"
publish = false

[[bin]]
name = "keysmith-relay"
path = "src/main.rs"

[lib]
doctest = false

[dependencies]
keysmith-rewrite = { path = "../rewrite" }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", default-features = false }
hyper = { version = "1", features = ["server", "http1", "client"] }
