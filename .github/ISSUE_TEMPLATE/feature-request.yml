name: Feature request / 功能需求
description: Suggest an improvement / 提出功能建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        此 Issue 公开可见。请勿提交 token、cookie、私人路径、完整配置或提示词正文。
        This issue is public. Do not include tokens, cookies, private paths, complete configuration, or prompt content.
  - type: textarea
    id: request
    attributes:
      label: 需求描述 / Request
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed solution
      description: Describe the outcome you expect.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: 联系方式（可选）/ Contact (optional)
  - type: checkboxes
    id: redaction
    attributes:
      label: 脱敏确认 / Redaction confirmation
      options:
        - label: I reviewed this public issue and removed sensitive information. / 我已检查并删除敏感信息。
          required: true
